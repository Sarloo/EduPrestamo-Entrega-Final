name: eduprestamo

services:
  app:
    build:
      context: .
      target: runtime
    image: eduprestamo:local
    init: true
    environment:
      NODE_ENV: production
      PORT: 3000
      JWT_SECRET: ${JWT_SECRET:-}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-1h}
      DATABASE_PATH: /app/data/eduprestamo.sqlite
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3000}
      LOGIN_MAX_ATTEMPTS: ${LOGIN_MAX_ATTEMPTS:-3}
      LOCKOUT_MINUTES: ${LOCKOUT_MINUTES:-15}
    ports:
      - "${PORT:-3000}:3000"
    volumes:
      - eduprestamo-data:/app/data
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - >-
          fetch('http://127.0.0.1:3000/health')
          .then((response) => { if (!response.ok) process.exit(1); })
          .catch(() => process.exit(1));
      interval: 10s
      timeout: 3s
      start_period: 10s
      retries: 5

volumes:
  eduprestamo-data:

